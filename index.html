<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BYD Lottery</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1b2a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Safe Area Covers for Mobile Status & Navigation Bars */
    .safe-area-top,
    .safe-area-bottom {
      position: fixed;
      left: 0;
      right: 0;
      background-color: #0d1b2a;
      z-index: 30;
      pointer-events: none;
    }

    .safe-area-top {
      top: 0;
      height: env(safe-area-inset-top, 0px);
    }

    .safe-area-bottom {
      bottom: 0;
      height: env(safe-area-inset-bottom, 0px);
    }

    /* Main App Container */
    .app-frame-container {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .app-iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }

    /* Fullscreen Loading Overlay with b.png */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background-color: #0d1b2a;
      background-image: url('b.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      text-align: center;
      padding: 20px;
    }

    .app-opening-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 24px 32px;
      border-radius: 16px;
      background: rgba(13, 27, 42, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
    }

    .loader-spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .opening-text {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="safe-area-top"></div>
  <div class="safe-area-bottom"></div>

  <div class="app-frame-container">
    <div class="loading-overlay" id="frameLoader">
      <div class="app-opening-card">
        <div class="loader-spinner"></div>
        <div class="opening-text" id="loaderStatus">Loading BYD lottery...</div>
      </div>
    </div>
    
    <iframe id="appIframe" class="app-iframe" src="" allowfullscreen></iframe>
  </div>

  <script>
    const TARGET_URL = "https://birrgo.github.io/Car-lottery-/";

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

    function initAppView() {
      const loader = document.getElementById('frameLoader');
      const iframe = document.getElementById('appIframe');

      if (loader) loader.style.display = 'flex';

      const minimumWaitTime = new Promise((resolve) => setTimeout(resolve, 5000));
      const iframeLoadEvent = new Promise((resolve) => {
        iframe.onload = resolve;
      });

      Promise.all([minimumWaitTime, iframeLoadEvent]).then(() => {
        if (loader) loader.style.display = 'none';
      });

      iframe.src = TARGET_URL;
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAppView();
    });
  </script>
</body>
</html>
